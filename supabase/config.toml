# Templates d'e-mails d'authentification — voir supabase/templates/*.html
# Pour les appliquer au projet distant : `supabase link` puis `supabase config push`.
# Si vous n'utilisez pas la CLI, copiez le contenu de chaque fichier HTML dans
# Dashboard Supabase → Authentication → Email Templates → (modèle correspondant).

[auth.email.template.confirmation]
subject = "Confirmez votre adresse e-mail — JobTracker"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe — JobTracker"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion — JobTracker"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse e-mail — JobTracker"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Vous avez été invité(e) sur JobTracker"
content_path = "./supabase/templates/invite.html"

# Accès par code (édition lite) — voir docs/superpowers/specs/2026-09-13-lite-access-code-design.md §4.4
[functions.board-create]
verify_jwt = false

[functions.board-open]
verify_jwt = false

[functions.board-rotate-code]
verify_jwt = true

[functions.board-delete]
verify_jwt = true
