<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobTracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="screen active">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-icon">💼</span>
        <h1>JobTracker</h1>
        <p>Suivez vos candidatures simplement</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" placeholder="Votre prénom" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">Commencer</button>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div id="app-screen" class="screen">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo-icon">💼</span>
        <span class="sidebar-title">JobTracker</span>
        <button class="sidebar-close" id="sidebar-close">✕</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="#" class="nav-item" data-page="applications">
          <span class="nav-icon">📋</span> Candidatures
        </a>
        <a href="#" class="nav-item" data-page="kanban">
          <span class="nav-icon">🗂️</span> Kanban
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <span class="user-avatar" id="user-avatar">M</span>
          <span class="user-name" id="user-name">Mael</span>
        </div>
        <button class="btn-logout" id="logout-btn">Déconnexion</button>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main-wrapper">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn">☰</button>
        <h2 class="page-title" id="page-title">Dashboard</h2>
        <button class="btn btn-primary" id="add-btn">+ Nouvelle candidature</button>
      </header>

      <main class="main-content">

        <!-- DASHBOARD PAGE -->
        <div id="page-dashboard" class="page active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="stat-total">0</div>
              <div class="stat-label">Total</div>
            </div>
            <div class="stat-card stat-blue">
              <div class="stat-number" id="stat-applied">0</div>
              <div class="stat-label">Postulées</div>
            </div>
            <div class="stat-card stat-orange">
              <div class="stat-number" id="stat-interview">0</div>
              <div class="stat-label">Entretiens</div>
            </div>
            <div class="stat-card stat-green">
              <div class="stat-number" id="stat-offer">0</div>
              <div class="stat-label">Offres</div>
            </div>
          </div>
          <div class="section-header">
            <h3>Candidatures récentes</h3>
          </div>
          <div id="recent-list" class="applications-list"></div>
        </div>

        <!-- APPLICATIONS PAGE -->
        <div id="page-applications" class="page">
          <div class="filter-bar">
            <input type="text" id="search-input" placeholder="Rechercher..." class="search-input" />
            <select id="filter-status" class="filter-select">
              <option value="">Tous les statuts</option>
              <option value="saved">Sauvegardée</option>
              <option value="applied">Postulée</option>
              <option value="interview">Entretien</option>
              <option value="offer">Offre reçue</option>
              <option value="rejected">Refusée</option>
            </select>
          </div>
          <div id="applications-list" class="applications-list"></div>
        </div>

        <!-- KANBAN PAGE -->
        <div id="page-kanban" class="page">
          <div class="kanban-board" id="kanban-board">
            <div class="kanban-col" data-status="saved">
              <div class="kanban-col-header">
                <span class="kanban-dot dot-gray"></span> Sauvegardée
                <span class="kanban-count" id="k-saved">0</span>
              </div>
              <div class="kanban-cards" id="kanban-saved"></div>
            </div>
            <div class="kanban-col" data-status="applied">
              <div class="kanban-col-header">
                <span class="kanban-dot dot-blue"></span> Postulée
                <span class="kanban-count" id="k-applied">0</span>
              </div>
              <div class="kanban-cards" id="kanban-applied"></div>
            </div>
            <div class="kanban-col" data-status="interview">
              <div class="kanban-col-header">
                <span class="kanban-dot dot-orange"></span> Entretien
                <span class="kanban-count" id="k-interview">0</span>
              </div>
              <div class="kanban-cards" id="kanban-interview"></div>
            </div>
            <div class="kanban-col" data-status="offer">
              <div class="kanban-col-header">
                <span class="kanban-dot dot-green"></span> Offre reçue
                <span class="kanban-count" id="k-offer">0</span>
              </div>
              <div class="kanban-cards" id="kanban-offer"></div>
            </div>
            <div class="kanban-col" data-status="rejected">
              <div class="kanban-col-header">
                <span class="kanban-dot dot-red"></span> Refusée
                <span class="kanban-count" id="k-rejected">0</span>
              </div>
              <div class="kanban-cards" id="kanban-rejected"></div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- MODAL CANDIDATURE -->
  <div id="modal-application" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Nouvelle candidature</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <form id="application-form">
        <input type="hidden" id="form-id" />
        <div class="form-row">
          <div class="form-group">
            <label>Entreprise *</label>
            <input type="text" id="form-company" placeholder="Google" required />
          </div>
          <div class="form-group">
            <label>Poste *</label>
            <input type="text" id="form-role" placeholder="Développeur Frontend" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Lieu</label>
            <input type="text" id="form-location" placeholder="Paris, France" />
          </div>
          <div class="form-group">
            <label>Contrat</label>
            <input type="text" id="form-contract" placeholder="CDI, CDD, Stage..." />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Salaire</label>
            <input type="text" id="form-salary" placeholder="45 000€" />
          </div>
          <div class="form-group">
            <label>Statut</label>
            <select id="form-status">
              <option value="saved">Sauvegardée</option>
              <option value="applied">Postulée</option>
              <option value="interview">Entretien</option>
              <option value="offer">Offre reçue</option>
              <option value="rejected">Refusée</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>URL de l'offre</label>
          <input type="url" id="form-url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="form-notes" rows="3" placeholder="Notes sur la candidature..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modal-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary" id="form-submit">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DETAIL CANDIDATURE -->
  <div id="modal-detail" class="modal-overlay hidden">
    <div class="modal modal-large">
      <div class="modal-header">
        <div>
          <h3 id="detail-title"></h3>
          <span id="detail-company" class="detail-company"></span>
        </div>
        <button class="modal-close" id="detail-close">✕</button>
      </div>
      <div class="detail-body">
        <div class="detail-info">
          <div class="detail-meta" id="detail-meta"></div>
          <div class="detail-actions">
            <button class="btn btn-secondary btn-sm" id="detail-edit">Modifier</button>
            <button class="btn btn-danger btn-sm" id="detail-delete">Supprimer</button>
          </div>
        </div>
        <div class="timeline-section">
          <div class="timeline-header">
            <h4>Timeline</h4>
            <button class="btn btn-primary btn-sm" id="add-step-btn">+ Étape</button>
          </div>
          <div id="timeline-list" class="timeline-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL ÉTAPE TIMELINE -->
  <div id="modal-step" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3>Ajouter une étape</h3>
        <button class="modal-close" id="step-close">✕</button>
      </div>
      <form id="step-form">
        <div class="form-group">
          <label>Type d'étape</label>
          <select id="step-type">
            <option value="applied">Candidature envoyée</option>
            <option value="confirmation">Accusé de réception</option>
            <option value="interview_hr">Entretien RH</option>
            <option value="interview_manager">Entretien manager</option>
            <option value="test">Test / Cas pratique</option>
            <option value="offer">Offre reçue</option>
            <option value="rejected">Refus</option>
            <option value="custom">Étape libre</option>
          </select>
        </div>
        <div class="form-group" id="custom-title-group" style="display:none">
          <label>Titre</label>
          <input type="text" id="step-title" placeholder="Titre de l'étape" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="step-date" required />
          </div>
          <div class="form-group">
            <label>Heure</label>
            <input type="time" id="step-time" />
          </div>
        </div>
        <div class="form-group">
          <label>Statut</label>
          <select id="step-status">
            <option value="done">Terminé</option>
            <option value="current">En cours</option>
            <option value="upcoming">À venir</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea id="step-notes" rows="3" placeholder="Notes sur cette étape..."></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="step-cancel">Annuler</button>
          <button type="submit" class="btn btn-primary">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
